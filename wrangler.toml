name = "scholario"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
VITE_SUPABASE_URL = ""
VITE_SUPABASE_ANON_KEY = ""

[assets]
directory = "./dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "NOTES_BUCKET"
bucket_name = "scholario-notes"


name = "scholario"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
BUN_VERSION = "1.2.15"
SUPABASE_URL = "https://rxgrxjlyrfzojvirkhdc.supabase.co"
SUPABASE_ANON_KEY = "placeholder-anon-key"
VITE_SUPABASE_URL = "https://rxgrxjlyrfzojvirkhdc.supabase.co"
VITE_SUPABASE_ANON_KEY = "placeholder-anon-key"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "NOTES_BUCKET"
bucket_name = "scholario-notes"

[[r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "scholario-avatars"

[[r2_buckets]]
binding = "CHAT_ATTACHMENTS"
bucket_name = "scholario-chat-attachments"


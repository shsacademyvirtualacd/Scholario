name = "scholario"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
BUN_VERSION = "1.2.15"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "NOTES_BUCKET"
bucket_name = "scholario-notes"

[[r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "scholario-avatars"

[[r2_buckets]]
binding = "CHAT_ATTACHMENTS"
bucket_name = "scholario-chat-attachments"


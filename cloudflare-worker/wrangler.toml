name = "scholario-apk-worker"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# Cloudflare R2 Bucket Binding
[[r2_buckets]]
binding = "APK_BUCKET"
bucket_name = "scholario-apk"
preview_bucket_name = "scholario-apk-preview"

[vars]
PUBLIC_DOMAIN = "https://files.scholario.app"
SUPABASE_URL = "https://your-supabase-project.supabase.co"
SUPABASE_ANON_KEY = "your-supabase-anon-key"
